name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: |
          npm install -g @earendil-works/pi-coding-agent@1.6.0
          npm install --prefix "$HOME/.pi/agent/npm" pi-subagents@0.90.0
          printf '%s\n' '{"packages":["npm:pi-subagents"]}' > "$HOME/.pi/agent/settings.json"
      - run: npm run check
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        name: Prove missing Pi fails closed
        run: |
          if PI_BINARY=yaat-no-such-pi npm run test:e2e -w service -- pi-deterministic > "$RUNNER_TEMP/pi-negative.log" 2>&1; then exit 1; fi
          grep -F 'Pi E2E requires the pi binary' "$RUNNER_TEMP/pi-negative.log"
      - run: npm run test:ci
        env:
          YAAT_CI_INSTALL_CHROMIUM: ${{ runner.os == 'Windows' && '1' || '' }}
