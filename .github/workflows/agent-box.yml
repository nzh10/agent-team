name: agent-box
run-name: agent-box ${{ inputs.lease }}
on:
  push:
    branches: [agent-box]
  workflow_dispatch:
    inputs:
      lease:
        required: true
      pubkey:
        required: true
      minutes:
        default: "340"
      os:
        type: choice
        default: linux
        options: [linux, linux-arm, macos, macos-intel, windows, windows-arm]
permissions: {}
jobs:
  box:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'nzh10' && github.triggering_actor == 'nzh10'
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","linux-arm":"ubuntu-24.04-arm","macos":"macos-15","macos-intel":"macos-15-intel","windows":"windows-2025","windows-arm":"windows-11-arm"}')[inputs.os] || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: 16bit-ykiko/agent-box@13aac23bb1a43ff78a5481400db67f900bcd79af
        with:
          pubkey: ${{ inputs.pubkey }}
          minutes: ${{ inputs.minutes }}
