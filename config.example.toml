# Agent Team / YAAT Configuration
# Recommended: generate config.toml automatically with random auth secrets:
#   ./scripts/yaat-service.sh init-config
# Or copy this file manually:
#   cp config.example.toml config.toml

# Server settings
[server]
# URL for remote image/file uploads (optional)
# remote_uploads_url = "http://your-server/uploads"
# Explicit service-manager restart command. Required to enable self-restart on macOS.
# Replace 501 with your `id -u` (`yaat-service.sh init-config` fills this in automatically).
# restart_command = ["launchctl", "kickstart", "-k", "gui/501/com.yaat.server"]

# Outbound proxy for the service and children. Omitted keys inherit the service
# environment. Restart after changing these; loopback always bypasses this proxy.
# [server.proxy]
# http_proxy = "http://127.0.0.1:7890"
# https_proxy = "http://127.0.0.1:7890"
# no_proxy = "example.internal"

# Authentication (optional — remove this section to disable auth)
[auth]
username = "agent"
# Plain-text password checked against the form input.
# For production, consider hashing; the server compares raw values.
password = "changeme"
# Random hex string used to sign session cookies. Generate with:
#   openssl rand -hex 32
session_secret = "generate-a-random-hex-string"
max_age_days = 30

# Workspace housekeeping
[workspace]
# Workspaces with no activity for this many days are archived automatically:
# they move to the sidebar's "Archived" section, their history leaves memory
# (still on disk, restored when opened) and idle CLI processes are shut down.
# Sending a message to an archived workspace restores it. 0 disables.
archive_after_days = 14

# Hosts — currently only "local" type is supported
[hosts.local]
label = "Local"
type = "local"

# Pi (optional — keeping [pi] present populates the Pi model picker at startup)
# Omit `packages` (or leave it empty) to use locally installed packages listed
# in ~/.pi/agent/settings.json. Configure custom providers in ~/.pi/agent/models.json.
# Use `exclude_packages` to block specific packages. `offline` defaults to true.
[pi]
# exclude_packages = []
# default_model = "provider/model"
# default_effort = "medium"
# offline = false  # allow Pi to access npm on startup (default: true)

# YAAT owns the permission/update fields in its Pi profile, not the host profile.
# yolo allows edits and commands without asking. Use default for confirmation.
# [pi.acp]
# permissions = "yolo"       # default | auto_edit | yolo
# runtime_updates = "manual" # manual | notify | automatic
# binary = "/absolute/path/to/agy_acp_server.par" # overrides AGY_ACP_BIN; restart required

# Projects (optional): the model a new project's lead runs on, and the
# workers it starts without naming one. Any model from the picker; effort if
# the model has it.
# [projects]
# model = "provider/model"
# effort = "medium"

# lead_name = "Lead"
# lead_avatar = "avatars/lead.jpg"
# lead_color = "#D8A0D8"
# Without overrides the lead uses the first preset's avatar and color.

# Your name and avatar in chat. Use an emoji, a text label without a slash,
# or an image path such as avatars/me.png.
# Files in avatars/ beside config.toml take precedence over bundled avatars.
[user]
# name = "You"
# avatar = "avatars/header.jpg"
language = "简体中文"  # user-facing project replies, questions and summaries only

# Repeat to replace the built-in agent presets; omitted or empty uses built-ins.
# A project worker can use a preset by exact name, with model and effort overrides.
# Otherwise workers pick the least-used identity matching model and effort,
# then model alone, then presets without a model, then built-ins.
# Model and effort are optional defaults in the Add Agent dialog; use an exact picker ID.
# when_to_use is optional short dispatch guidance shown only to project leads in
# start_session; blank values are ignored. Keep it beside the preset it describes.
# [[agent_presets]]
# name = "Scout"
# avatar = "🔎"
# color = "#789abc"
# model = "provider/model"
# effort = "medium"
# when_to_use = "Broad codebase exploration and fact-finding"
